<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fretlab — guitar practice</title>
  <meta name="description" content="See the notes you play on a live fretboard and stave, learn scales, and tune to any tuning." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fretlab" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-view="fretboard">
  <div class="app">

    <!-- Fretboard + Learn: [stave | note or learn | controls] over the fretboard -->
    <div id="view-fretboard" class="view-group">
      <section class="mod mod-a stave-mod" aria-label="Stave">
        <div id="stave"></div>
      </section>

      <section class="mod mod-b note-card" id="note-card" aria-label="Note">
        <div class="big-note"><span id="note-name">—</span><sub id="note-oct"></sub></div>
        <p class="enh" id="note-enh">Play a single note</p>
        <div class="freq"><span id="note-hz">—</span><span class="unit">Hz</span><span class="cents" id="note-cents"></span></div>
        <div class="mini-cents" aria-hidden="true"><span class="mid"></span><span id="mini-needle"></span></div>
      </section>

      <section class="mod mod-b learn-card" id="learn-card" aria-label="Learn">
        <header class="mod-head learn-head">
          <details class="picker" id="learn-picker">
            <summary class="btn small"><span id="learn-title">C major</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
            <div class="picker-panel">
              <label class="field"><span>Key</span><select id="learn-root"></select></label>
              <label class="field"><span>Scale</span><select id="learn-scale"></select></label>
              <label class="field"><span>Where on the neck</span><select id="learn-position"></select></label>
            </div>
          </details>
          <button class="btn icon" id="learn-hear" type="button" aria-label="Hear the scale" title="Hear it">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button>
          <button class="btn icon" id="learn-restart" type="button" aria-label="Start again" title="Start again">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
        </header>
        <div class="learn-body">
          <p class="label" id="learn-label">Play</p>
          <div class="big-note"><span id="learn-note">—</span><sub id="learn-oct"></sub></div>
          <p class="learn-where" id="learn-where"></p>
        </div>
        <div class="learn-foot">
          <div class="progress" aria-hidden="true"><span id="learn-bar"></span></div>
          <p class="learn-count" id="learn-count"></p>
        </div>
      </section>

      <section class="mod mod-board fb-card" aria-label="Fretboard">
        <div id="fretboard"></div>
      </section>

      <div class="mod rotate-prompt">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect class="phone" x="22" y="8" width="20" height="36"/><path class="arrow" d="M14 50a22 22 0 0 0 36 0"/><path class="arrow" d="M46 46l4 4-6 2"/></svg>
        <p class="rotate-title">Turn your phone sideways</p>
        <p class="rotate-text">The fretboard needs landscape to fit all 22 frets.</p>
        <button class="btn" id="rotate-tuner" type="button">Use the tuner instead</button>
      </div>
    </div>

    <!-- Tuner: [gauge | readout | controls] over the pitch trace and strings -->
    <div id="view-tuner" class="view-group tuner idle" hidden>
      <section class="mod mod-a gauge-mod" aria-label="Tuner gauge">
        <div id="gauge" class="gauge"></div>
      </section>
      <section class="mod mod-b tuner-readout" aria-label="Tuning">
        <div class="big-note"><span id="tuner-note">—</span><sub id="tuner-octave"></sub></div>
        <p id="tuner-hint" class="tuner-hint">Play any open string</p>
        <div class="freq"><span id="tuner-hz">—</span><span class="unit">Hz</span><span class="cents" id="tuner-cents"></span></div>
      </section>
      <section class="mod mod-board trace-mod" aria-label="Pitch trace and strings">
        <div class="trace" aria-hidden="true">
          <span class="trace-label sharp-label">♯ sharp</span><span class="trace-label flat-label">♭ flat</span>
          <canvas id="tuner-trace"></canvas>
        </div>
        <div class="pill-row">
          <div id="string-pills" class="pills"></div>
        </div>
      </section>
    </div>

    <!-- Controls (shared by every view) -->
    <section class="mod mod-c controls" aria-label="Controls">
      <div class="tabs" role="tablist" aria-label="Mode">
        <button role="tab" id="tab-fretboard" aria-controls="view-fretboard" aria-selected="true" type="button">Frets</button>
        <button role="tab" id="tab-learn" aria-controls="view-fretboard" aria-selected="false" type="button">Learn</button>
        <button role="tab" id="tab-tuner" aria-controls="view-tuner" aria-selected="false" type="button">Tune</button>
      </div>
      <div class="ctrl-row">
        <label class="field grow"><span class="sr">Tuning</span><select id="tuning-select"></select></label>
        <details class="custom" id="custom-editor" hidden>
          <summary class="btn small" title="Edit the custom tuning">Strings</summary>
          <div class="custom-panel">
            <p class="custom-title">Custom tuning <span>· string 6 is the low one</span></p>
            <div id="custom-strings" class="custom-strings"></div>
          </div>
        </details>
      </div>
      <label class="sens"><span>Mic</span><input id="sens-input" type="range" min="0" max="1" step="0.05" value="0.55" aria-label="Mic sensitivity" /></label>
      <button id="mic-btn" class="btn primary listen" type="button" aria-pressed="false" aria-label="Start listening">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="mic-label">Listen</span>
      </button>
    </section>
  </div>

  <div id="banner" class="banner" role="alert" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
